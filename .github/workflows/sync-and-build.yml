name: Build latest CoreProtect

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout upstream CoreProtect master
        uses: actions/checkout@v4
        with:
          repository: PlayPro/CoreProtect
          ref: master
          fetch-depth: 1

      - name: Capture upstream commit SHA
        id: upstream
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Patch Community Edition Minecraft version cap
        run: |
          FILE=src/main/java/net/coreprotect/config/ConfigHandler.java
          sed -i 's|public static final String LATEST_VERSION = "[^"]*";|public static final String LATEST_VERSION = "99.99";|' "$FILE"
          if ! grep -q 'LATEST_VERSION = "99.99"' "$FILE"; then
            echo "Patch failed — LATEST_VERSION line shape may have changed upstream."
            grep LATEST_VERSION "$FILE"
            exit 1
          fi
          echo "Patched LATEST_VERSION cap to 99.99."

      - name: Set up JDK 25 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp -Dproject.branch=development clean package

      - name: Resolve built JAR & make version-independent copy
        id: jar
        run: |
          JAR="$(ls target/CoreProtect-*.jar | grep -v -E 'original-|sources|javadoc' | head -n1)"
          test -f "$JAR" || { echo "No JAR found"; exit 1; }
          cp "$JAR" target/CoreProtect-latest.jar
          echo "versioned=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: DEBUG RELEASE_TOKEN (temporary)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set +e
          echo "== token identity =="
          gh api user --jq '.login' || echo "  (no /user access for this token)"
          echo "== simple name PATCH =="
          gh api -X PATCH repos/froquefy/CoreProtect-DailyJar/releases/322648750 -f name='CoreProtect-24.0.jar' --jq '.id' && echo "  simple PATCH OK" || echo "  simple PATCH FAILED"
          echo "== make_latest PATCH =="
          gh api -X PATCH repos/froquefy/CoreProtect-DailyJar/releases/322648750 -F make_latest=true --jq '.id' && echo "  make_latest PATCH OK" || echo "  make_latest PATCH FAILED"

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: latest-build
          name: ${{ steps.jar.outputs.name }}
          make_latest: 'true'
          prerelease: false
          generate_release_notes: false
          body: |
            Automated rolling build from upstream master.

            Upstream commit: `${{ steps.upstream.outputs.sha }}`
            Built: run ${{ github.run_id }} on ${{ github.run_started_at }}
            JDK: Temurin 25

            **Stable download URLs:**
            - Version-independent: https://github.com/${{ github.repository }}/releases/latest/download/CoreProtect-latest.jar
            - Versioned: https://github.com/${{ github.repository }}/releases/latest/download/${{ steps.jar.outputs.name }}
          files: |
            target/CoreProtect-latest.jar
            ${{ steps.jar.outputs.versioned }}
